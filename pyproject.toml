[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marcelorei-autoperceive_jd303"
version = "0.1.0"
description = "通过字符级与结构级特征识别自动驾驶感知工程师·混合检索的权重调节的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "marcelorei" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://marcelorei.github.io"
Repository = "https://github.com/marcelorei/autoperceive_jd303"
Issues = "https://github.com/marcelorei/autoperceive_jd303/issues"

[project.scripts]
autoperceive_jd303 = "autoperceive_jd303:main"

[tool.setuptools]
py-modules = ["autoperceive_jd303"]
